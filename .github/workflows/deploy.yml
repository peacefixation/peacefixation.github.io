name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_goodreads:
        description: Re-fetch all Goodreads book metadata
        type: boolean
        default: false
      refresh_og:
        description: Re-fetch all OpenGraph metadata
        type: boolean
        default: false
      refresh_youtube:
        description: Re-fetch YouTube channel metadata
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build SSG
        run: go build -o ssg .

      - name: Build site
        run: |
          FLAGS=""
          ${{ inputs.refresh_goodreads == 'true' && 'FLAGS="$FLAGS --refresh-goodreads"' || 'true' }}
          ${{ inputs.refresh_og == 'true' && 'FLAGS="$FLAGS --refresh-og"' || 'true' }}
          ${{ inputs.refresh_youtube == 'true' && 'FLAGS="$FLAGS --refresh-yt"' || 'true' }}
          mkdir -p cache && ./ssg build $FLAGS
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}

      - name: Commit refreshed caches
        if: inputs.refresh_goodreads == 'true' || inputs.refresh_og == 'true' || inputs.refresh_youtube == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git diff --cached --quiet || git commit -m "chore: refresh enrichment caches [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
